<body>
    
    <canvas id=c></canvas>
    <script>
        const ctx = c.getContext("2d");
        const h = 75;
        const margin = 200;
        const enmargin = 100;
        const jumpv = 20;
        let thingy = false;
        let touchingstar = false;
        let points = 0;
        let count = 0;
        let gameState = "playing";
        let gnd = innerHeight;
        let space = true;
        let quota = 0;
        let down = false;
        let player = {w: 75, h: h, x: 500, y: innerHeight-h-margin, upv: 0};
        //let enemy = {width: 100, height: 100, x: innerWidth + 100, y: innerHeight, type: ""};
        let enemies = [{w: 200, h: 100, x: innerWidth + Math.random()*1000, y: Math.random()*(innerHeight-100), type: ""}, {w: 200, h: 50, x: innerWidth + Math.random()*4000, y: Math.random()*(innerHeight-50), type: ""}, {w: 100, h: 200, x: innerWidth + Math.random()*300, y: innerHeight-100, type: ""}, {w: 300, h: 50, x: innerWidth + Math.random()*10000, y: Math.random()*(innerHeight-50), type: ""}, {w: 50, h: 150, x: innerWidth + Math.random()*20000, y: Math.random()*(innerHeight-150), type: ""}, {w: 50, h: 150, x: innerWidth + Math.random()*500, y: Math.random()*(innerHeight-150), type: "star"}];
        const playagain = {x: innerWidth/2, y: innerHeight/2 + 50, w: 200, h: 100};
        // CHANGE THIS TO CHANGE GAME SPEED
        const speed = 500;
        //this is the cool drawing function
        function draw(time) {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, innerWidth, innerHeight);
            ctx.fillStyle = "red";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            /*
            ctx.fillStyle = "grey";
                ctx.fillRect(player.x-40, player.y, 40, player.h);
            */for (let i in enemies) {
                ctx.fillStyle = "red";
                const enemy = enemies[i];
                ctx.fillStyle = "white";
                if (enemy.type == "star") {
                    ctx.fillStyle = "yellow";
                }
                /*
                const topspikes = Math.floor(enemy.w/10);
                const sideSpikes = Math.floor(enemy.h/10);
                for (let i = 0; i < topspikes; i++) {
                    ctx.fillRect(enemy.x + 10 * i, enemy.y-10, 3, 10);
                    ctx.fillRect(enemy.x + 10 * i, enemy.y+enemy.h, 3, 10);
                }
                for (let i = 0; i < sideSpikes; i++) {
                    ctx.fillRect(enemy.x-10, enemy.y + 10*i, 10, 3);
                }*/
                ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                /*ctx.fillStyle = "red";
                ctx.font = "bold 48px serif";*/
                /*
                if (enemy.type != "star") {
                    ctx.fillText("(:<", enemy.x, enemy.y+50);
                }*/
                ctx.font = "48px serif";
            }
            ctx.fillStyle = "black";
            ctx.fillRect(player.x+20, player.y+25, 10, 10);
            ctx.fillRect(player.x+player.w-30, player.y + 25, 10, 10);
            ctx.fillRect(player.x, player.y, 7, 7);
            ctx.fillRect(player.x+player.w-7, player.y, 7, 7);
            ctx.fillRect(player.x, player.y+player.h-7, 7, 7);
            ctx.fillRect(player.x+player.w-7, player.y+player.h-7, 7, 7);
            /*
            if (thingy) {
                
                ctx.fillStyle = "orange";
                ctx.fillRect(player.x-40, player.y+player.h, 40, 50);
                ctx.fillRect(player.x-30, player.y + player.h+50, 20, 30);
            }*/
            if (gameState == "end") {
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, innerWidth, innerHeight);
                ctx.fillStyle = "red";
                ctx.font = "48px serif";
                ctx.fillText("Oops.", innerWidth/2, innerHeight/2);
                ctx.fillStyle = "white";
                ctx.fillRect(innerWidth/2, innerHeight/2+50, playagain.w, playagain.h);
                ctx.fillStyle = "red";
                ctx.font = "30px serif";
                ctx.fillText("Play again", innerWidth/2, innerHeight/2+100);
                ctx.font = "48px serif";
            }
            if (space) {
                ctx.fillStyle = "white";
                ctx.font = "48px serif";
                ctx.fillText("space/w/up/click", innerWidth/2, innerHeight/2);
            }
            ctx.fillStyle = "white";
            ctx.fillText(points, 50, 50);
            
        }
        
        function move(dt) {
            if (gameState == "playing") {
            player.y += -(player.upv);
            //gravity:
            player.upv -=1;
            for (let i in enemies) {
                let enemy = enemies[i];
                enemy.x = (enemy.x - speed * dt);
                
            if (enemy.x + enemy.w < 0) {
                const n = Math.random()*3000;
                if (enemy.type == "star") {
                    enemy.x = innerWidth + Math.random()*500;
                } else {
                    enemy.x = innerWidth+Math.random()*n;
                }
                
                enemy.y = Math.random()*(innerHeight-enemy.h);
                count++;
                /*
                if (count % 6 == 0) {
                    count = 0;
                    enemies = [{width: 200, height: 100, x: innerWidth + 0, y: Math.random()*(innerHeight), type: ""}, {width: 200, height: 50, x: innerWidth + Math.random()*4000, y: Math.random()*(innerHeight), type: ""}, {width: 100, height: 200, x: innerWidth + Math.random()*8000, y: Math.random()*(innerHeight), type: ""}, {width: 300, height: 50, x: innerWidth + Math.random()*10000, y: Math.random()*(innerHeight), type: ""}, {width: 50, height: 150, x: innerWidth + Math.random()*20000, y: Math.random()*(innerHeight), type: ""}, {width: 50, height: 150, x: innerWidth + Math.random()*200, y: Math.random()*(innerHeight), type: "star"}];
                } */ 
            }
              if (istouching(player, enemy)) {
                if (enemy.type == "star") {
                    if (!touchingstar) {
                        points++;
                        touchingstar = true;
                        enemy.x = innerWidth + Math.random()*500;
                    }
                } else {
                //touchingstar = false;
                space = false;
                gameState = "end";
                }
                
            } else {
                touchingstar = false;
            }
            }
            
            
            if (player.y + player.h > gnd) {
                //rng
                quota = 0;
                player.y -= 10;
                
                player.upv *= -1/2;
                player.y = innerHeight - player.h;
                
            } else if (player.y < 0) {
                player.y += 10;
                player.upv *= -1/2;
                player.y = 0;
            }
          
            }
        }
        function istouching(r1, r2) {
            //a and b are just x and y for the second entity
            if (r1.x + r1.w < r2.x || r1.y + r1.h < r2.y || r1.x > r2.x + r2.h || r1.y > r2.y + r2.h) {
                return false;
            } else {
                return true;
            }
        }
       function jump() {
        //if (quota < 2) {
            player.upv = jumpv;
            quota++;
        //}
       }
        window.addEventListener('keydown', (event) => {
            if (event.code == 'Space' || event.code == 'KeyW' || event.code == 'ArrowUp') {
                thingy = true;
                if (gameState == "playing") event.preventDefault();
                if (gameState == "end") location.reload();
                space = false;
                //if (player.y + player.h >= innerHeight-5) {
                if(!down) {
                    jump();
                    down = true;
                }
                //}
                
            } /* else if (event.code == 'ArrowLeft' || event.code == 'KeyA') {
                even
            } */
        });
        window.addEventListener('keyup', (event) => {
             if (event.code == 'Space' || event.code == 'KeyW' || event.code == 'ArrowUp') {
                down = false;
                thingy = false;
            }
        });
        window.addEventListener('click', (event) => {
            //if (player.y + player.h >= innerHeight-5) {
            space = false;
            jump();
            if (gameState == "end" && event.offsetX > playagain.x && event.offsetX < playagain.x+playagain.w && event.offsetY > playagain.y && event.offsetY < playagain.y + playagain.h) {
                location.reload();
            }
            //}
        });
        onresize = () => {
            c.width = innerWidth;
            c.height = innerHeight;
            draw();
        }
        onresize();
        let last = 0;
        function frame(now) {
            move(Math.min((now-last) / 1000, 0.1));
            last = now;
            draw(now);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        
        
    </script>
